version: '3.8'

services:
  db:
    image: mariajuliagermano/wallet-db:v2
    container_name: wallet_mysql
    
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: wallet_homolog
      
    ports:
      - "3306:3306"
      
    volumes:
      - mysql_hub_data:/var/lib/mysql
      
    healthcheck:
      test: "mysql -h localhost -u root -p$$MYSQL_ROOT_PASSWORD -D wallet_homolog -e 'SELECT 1 FROM carteira LIMIT 1'"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    image: mariajuliagermano/wallet-api:v2
    container_name: wallet_api
    
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: wallet_api_homolog
      DB_PASSWORD: api123
      DB_NAME: wallet_homolog
      TAXA_SAQUE_PERCENTUAL: 0.01
      TAXA_CONVERSAO_PERCENTUAL: 0.02
      TAXA_TRANSFERENCIA_PERCENTUAL: 0.01
      PRIVATE_KEY_SIZE: 32
      PUBLIC_KEY_SIZE: 16
      
    ports:
      - "8000:8000"
      
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_hub_data:
